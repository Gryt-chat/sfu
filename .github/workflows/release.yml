name: Release SFU

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release Channel"
        required: true
        default: "beta"
        type: choice
        options:
          - beta
          - latest
      bump:
        description: "Version Bump Type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version, if "custom" is selected'
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

env:
  RELEASE_OWNER: Gryt-chat
  RELEASE_REPO: sfu
  IMAGE: ghcr.io/gryt-chat/sfu

jobs:
  release:
    name: Release SFU
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Git user
        shell: bash
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ github.event.inputs.channel }}"

          if [[ "$CHANNEL" != "beta" && "$CHANNEL" != "latest" ]]; then
            echo "Invalid channel: $CHANNEL"
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Bump VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          BUMP="${{ github.event.inputs.bump }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid current VERSION: $CURRENT_VERSION"
            exit 1
          fi

          if [[ "$BUMP" == "custom" ]]; then
            if [[ -z "$CUSTOM_VERSION" ]]; then
              echo "custom_version is required when bump=custom"
              exit 1
            fi

            if ! [[ "$CUSTOM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
              echo "Invalid custom version: $CUSTOM_VERSION"
              echo "Expected semver like 1.2.3 or 1.2.3-beta.1"
              exit 1
            fi

            NEW_VERSION="$CUSTOM_VERSION"
          else
            BASE_VERSION="${CURRENT_VERSION%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

            if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
              echo "Invalid current VERSION: $CURRENT_VERSION"
              exit 1
            fi

            case "$BUMP" in
              major)
                NEW_VERSION="$((MAJOR + 1)).0.0"
                ;;
              minor)
                NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
                ;;
              patch)
                NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
                ;;
              *)
                echo "Invalid bump type: $BUMP"
                exit 1
                ;;
            esac
          fi

          if [[ "$NEW_VERSION" == "$CURRENT_VERSION" ]]; then
            echo "Version did not change: $CURRENT_VERSION"
            exit 1
          fi

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists on origin."
            exit 1
          fi

          printf '%s\n' "$NEW_VERSION" > VERSION

          git add VERSION
          git commit -m "release: v$NEW_VERSION (${{ steps.channel.outputs.channel }})"
          git tag "v$NEW_VERSION"
          git push origin HEAD
          git push origin "v$NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run go vet
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...

      - name: Build check
        shell: bash
        run: |
          set -euo pipefail
          go build -o /dev/null ./cmd/sfu

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"

          V_MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          V_MINOR="$(echo "$VERSION" | cut -d. -f2)"

          TAGS=(
            "${IMAGE}:${VERSION}"
            "${IMAGE}:${V_MAJOR}.${V_MINOR}"
            "${IMAGE}:${V_MAJOR}"
            "${IMAGE}:latest-beta"
          )

          if [[ "$CHANNEL" == "latest" ]]; then
            TAGS+=("${IMAGE}:latest")
          fi

          ARGS=()
          for TAG in "${TAGS[@]}"; do
            ARGS+=(-t "$TAG")
          done

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --cache-from type=registry,ref=${IMAGE}:buildcache \
            --cache-to type=registry,ref=${IMAGE}:buildcache,mode=max \
            "${ARGS[@]}" \
            --push .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Gryt SFU v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${WEBHOOK_URL:-}" ]]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL secret not set, skipping"
            exit 0
          fi

          TAG="v$VERSION"
          RELEASE_URL="https://github.com/${{ env.RELEASE_OWNER }}/${{ env.RELEASE_REPO }}/releases/tag/$TAG"

          if [[ "$CHANNEL" == "beta" ]]; then
            DISP_CHANNEL="Beta"
            COLOR=16750848
          else
            DISP_CHANNEL="Stable"
            COLOR=5763719
          fi

          RELEASE_BODY="$(gh release view "$TAG" --repo "${{ env.RELEASE_OWNER }}/${{ env.RELEASE_REPO }}" --json body -q '.body' || true)"
          BODY="$(printf '%s' "$RELEASE_BODY" | head -c 1800)"

          PAYLOAD="$(jq -n \
            --arg title "Gryt SFU $TAG" \
            --arg url "$RELEASE_URL" \
            --arg desc "$BODY" \
            --arg channel "$DISP_CHANNEL" \
            --arg component "SFU" \
            --arg tag "$TAG" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: $color,
                fields: [
                  { name: "Component", value: $component, inline: true },
                  { name: "Channel", value: $channel, inline: true },
                  { name: "Version", value: $tag, inline: true }
                ],
                footer: { text: "Gryt Releases" },
                timestamp: (now | todate)
              }]
            }'
          )"

          curl -sfS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
