name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Same source of truth as release.yml, so a Go bump in go.mod moves
          # both at once.
          go-version-file: go.mod
          cache: true
      # The only compile check this repo had was `go build -o /dev/null
      # ./cmd/sfu` inside release.yml, and that workflow is workflow_dispatch
      # only — so nothing checked a pull request at all. ./... rather than
      # ./cmd/sfu, because a package no binary imports still has to compile.
      - run: go build ./...
      - run: go vet ./...
      # These tests existed and had never run anywhere but a developer's
      # machine. -race because every bug this package has had is a race:
      # GRYT-32 was a renegotiation request dropped by a goroutine and the
      # message loop touching the same peer connection.
      - run: go test -race ./...
      # gofmt, checked rather than assumed. Four files had drifted and sat that
      # way because nothing looked — the worst of them was a switch indented one
      # level short inside a closure, which reads as a nesting level that is not
      # there. The diff is printed rather than only the filenames, so a failure
      # says what to change instead of sending somebody to run gofmt to find out.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt clean:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
